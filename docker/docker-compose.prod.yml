version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: customer360_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customer360
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: customer360_api
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: customer360
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET_KEY: customer360-prod-secret-change-me
      COMTELE_API_KEY: "${COMTELE_API_KEY}"
      RDSTATION_API_KEY: "${RDSTATION_API_KEY}"
      EVOLUTION_API_URL: "${EVOLUTION_API_URL}"
      EVOLUTION_API_KEY: "${EVOLUTION_API_KEY}"
      EVOLUTION_INSTANCE_NAME: "${EVOLUTION_INSTANCE_NAME}"
    ports:
      - "8001:8001"
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: customer360_front
    depends_on:
      - api
    ports:
      - "3001:3000"
    restart: unless-stopped

volumes:
  postgres_data:
