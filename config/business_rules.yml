# Regras de negócio do Customer 360

# Definição de cliente ativo/inativo
customer_status:
  active_days_threshold: 90  # Cliente ativo se comprou nos últimos 90 dias
  recency_bands:
    - name: "0-30 dias"
      min: 0
      max: 30
    - name: "31-60 dias"
      min: 31
      max: 60
    - name: "61-90 dias"
      min: 61
      max: 90
    - name: "91-180 dias"
      min: 91
      max: 180
    - name: "180+ dias"
      min: 181
      max: 999999

# RFM Segmentation
rfm:
  recency_scores: [1, 2, 3, 4, 5]  # 5 = mais recente
  frequency_scores: [1, 2, 3, 4, 5]  # 5 = mais compras
  monetary_scores: [1, 2, 3, 4, 5]  # 5 = maior valor

# Status válidos de vendas
valid_sales_status:
  - Aprovado
  - Completo
  - Complete
  - approved
  - completed

# Países válidos
valid_countries:
  - Brasil
  - Brazil
  - BR
